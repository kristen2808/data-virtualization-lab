services:
  trino:
    container_name: trino
    image: trinodb/trino:484
    ports:
      - "127.0.0.1:8443:8443"
    env_file:
      - ./secrets/trino/internal.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./trino/config.properties:/etc/trino/config.properties:ro
      - ./trino/password-authenticator.properties:/etc/trino/password-authenticator.properties:ro
      - ./trino/access-control.properties:/etc/trino/access-control.properties:ro
      - ./trino/access-control:/etc/trino/access-control:ro
      - ./secrets/trino/password.db:/etc/trino/auth/password.db:ro
      - ./secrets/trino/localhost.pem:/etc/trino/tls/localhost.pem:ro
      - ./trino/catalog/pg_lab.properties:/etc/trino/catalog/pg_lab.properties:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: trino-postgre
    image: postgres:17.11-bookworm
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: lab_db
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  sqlserver:
    container_name: sqlserver22
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  postgres_data:
  sqlserver_data:

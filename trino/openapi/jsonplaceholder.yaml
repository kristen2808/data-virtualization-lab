openapi: 3.0.3
info:
  title: JSONPlaceholder read-only PoC
  version: "1.0.0"
servers:
  - url: https://jsonplaceholder.typicode.com
security: []
paths:
  /users:
    get:
      operationId: listUsers
      summary: Read synthetic users without loading them into a database
      responses:
        "200":
          description: All users, returned as a single JSON array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
  /posts:
    get:
      operationId: listPosts
      summary: Read synthetic posts
      responses:
        "200":
          description: All posts, returned as a single JSON array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        username:
          type: string
        email:
          type: string
        phone:
          type: string
        website:
          type: string
    Post:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        title:
          type: string
        body:
          type: string
